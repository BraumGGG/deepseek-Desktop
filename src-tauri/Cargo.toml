[package]
name = "deepseek-harness-desktop"
version = "0.1.0"
description = "Lightweight desktop launcher for DeepSeek Harness"
authors = ["DeepSeek Harness Community"]
edition = "2021"

[lib]
name = "deepseek_harness_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.0.0", features = [] }

[dependencies]
tauri = { version = "=2.0.0", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
